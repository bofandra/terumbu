name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('terumbu-pr-{0}', github.event.pull_request.number) || 'terumbu-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate deploy scripts
        run: bash -n scripts/deploy-vps.sh scripts/smoke-production.sh

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Critical-path E2E
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: terumbu_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d terumbu_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/terumbu_e2e
      DEMO_ROLE_PASSWORD: TerumbuE2E2026!
      CRON_SECRET: terumbu-e2e-cron-secret
      SESSION_COOKIE_SECURE: "false"
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare E2E database from production migrations
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:seed-role-users

      - name: Run critical-path E2E
        run: npm run test:e2e

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-24.04
    needs: [verify, e2e]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST}" || { echo "VPS_HOST secret is required"; exit 1; }
          test -n "${VPS_USER}" || { echo "VPS_USER secret is required"; exit 1; }
          test -n "${VPS_SSH_KEY}" || { echo "VPS_SSH_KEY secret is required"; exit 1; }

          install -m 700 -d ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/terumbu_deploy_key
          chmod 600 ~/.ssh/terumbu_deploy_key
          ssh-keyscan -H "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Render production env
        env:
          TERUMBU_APP_PORT: ${{ vars.TERUMBU_APP_PORT }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          SESSION_COOKIE_SECURE: ${{ vars.SESSION_COOKIE_SECURE }}
          TERUMBU_POSTGRES_DB: ${{ vars.TERUMBU_POSTGRES_DB }}
          TERUMBU_POSTGRES_USER: ${{ vars.TERUMBU_POSTGRES_USER }}
          TERUMBU_POSTGRES_PASSWORD: ${{ secrets.TERUMBU_POSTGRES_PASSWORD }}
          TERUMBU_DATABASE_URL: ${{ secrets.TERUMBU_DATABASE_URL }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID || vars.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET || vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_PUBLIC_BASE_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_BASE_URL || vars.CLOUDFLARE_R2_PUBLIC_BASE_URL }}
          CORPORATE_REPORT_STORAGE: ${{ vars.CORPORATE_REPORT_STORAGE }}
          CORPORATE_REPORT_R2_BUCKET: ${{ secrets.CORPORATE_REPORT_R2_BUCKET || vars.CORPORATE_REPORT_R2_BUCKET }}
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          MIDTRANS_CLIENT_KEY: ${{ secrets.MIDTRANS_CLIENT_KEY }}
          XENDIT_SECRET_KEY: ${{ secrets.XENDIT_SECRET_KEY }}
          DEMO_GATEWAY_WEBHOOK_SECRET: ${{ secrets.DEMO_GATEWAY_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL || vars.SUPPORT_EMAIL }}
          NEXT_PUBLIC_SUPPORT_WHATSAPP_URL: ${{ secrets.NEXT_PUBLIC_SUPPORT_WHATSAPP_URL || vars.NEXT_PUBLIC_SUPPORT_WHATSAPP_URL }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          ADMIN_QUERY_WARN_MS: ${{ vars.ADMIN_QUERY_WARN_MS }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_FX_USD_EUR: ${{ vars.NEXT_PUBLIC_FX_USD_EUR }}
          NEXT_PUBLIC_FX_USD_IDR: ${{ vars.NEXT_PUBLIC_FX_USD_IDR }}
          NEXT_PUBLIC_FX_USD_JPY: ${{ vars.NEXT_PUBLIC_FX_USD_JPY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail

          clean_env_value() {
            printf '%s' "$1" | tr -d '\r\n'
          }

          quote_env_value() {
            local value
            value="$(clean_env_value "$1")"
            printf "'%s'" "$(printf '%s' "${value}" | sed "s/'/'\\\\''/g")"
          }

          write_env_value() {
            printf '%s=' "$1" >> terumbu.production.env
            quote_env_value "$2" >> terumbu.production.env
            printf '\n' >> terumbu.production.env
          }

          APP_PORT="$(clean_env_value "${TERUMBU_APP_PORT:-3100}")"
          POSTGRES_DB="$(clean_env_value "${TERUMBU_POSTGRES_DB:-terumbu}")"
          POSTGRES_USER="$(clean_env_value "${TERUMBU_POSTGRES_USER:-terumbu}")"
          POSTGRES_PASSWORD="$(clean_env_value "${TERUMBU_POSTGRES_PASSWORD}")"
          PUBLIC_URL="$(clean_env_value "${NEXT_PUBLIC_APP_URL:-http://${VPS_HOST}:${APP_PORT}}")"
          printf 'TERUMBU_PUBLIC_URL=%s\n' "${PUBLIC_URL}" >> "${GITHUB_ENV}"
          POSTHOG_HOST_VALUE="$(clean_env_value "${POSTHOG_HOST:-https://app.posthog.com}")"
          ADMIN_QUERY_WARN_MS_VALUE="$(clean_env_value "${ADMIN_QUERY_WARN_MS:-750}")"
          CRON_SECRET_VALUE="$(clean_env_value "${CRON_SECRET:-}")"
          if [ -z "${CRON_SECRET_VALUE}" ]; then
            CRON_SECRET_VALUE="$(openssl rand -hex 32)"
          fi

          test -n "${POSTGRES_PASSWORD}" || { echo "TERUMBU_POSTGRES_PASSWORD secret is required"; exit 1; }

          R2_CONFIGURED_COUNT=0
          for value in \
            "${CLOUDFLARE_R2_ACCOUNT_ID}" \
            "${CLOUDFLARE_R2_BUCKET}" \
            "${CLOUDFLARE_R2_ACCESS_KEY_ID}" \
            "${CLOUDFLARE_R2_SECRET_ACCESS_KEY}" \
            "${CLOUDFLARE_R2_PUBLIC_BASE_URL}"; do
            if [ -n "$(clean_env_value "${value}")" ]; then
              R2_CONFIGURED_COUNT=$((R2_CONFIGURED_COUNT + 1))
            fi
          done

          if [ "${R2_CONFIGURED_COUNT}" -ne 0 ] && [ "${R2_CONFIGURED_COUNT}" -ne 5 ]; then
            echo "Cloudflare R2 production configuration must provide all five R2 values or none of them." >&2
            exit 1
          fi

          REPORT_STORAGE_MODE="$(clean_env_value "${CORPORATE_REPORT_STORAGE:-local}")"
          REPORT_PRIVATE_BUCKET="$(clean_env_value "${CORPORATE_REPORT_R2_BUCKET:-}")"
          if [ "${REPORT_STORAGE_MODE}" != "local" ] && [ "${REPORT_STORAGE_MODE}" != "r2" ]; then
            echo "CORPORATE_REPORT_STORAGE must be local or r2." >&2
            exit 1
          fi
          if [ "${REPORT_STORAGE_MODE}" = "r2" ]; then
            if [ "${R2_CONFIGURED_COUNT}" -ne 5 ] || [ -z "${REPORT_PRIVATE_BUCKET}" ] || [ "${REPORT_PRIVATE_BUCKET}" = "${CLOUDFLARE_R2_BUCKET}" ]; then
              echo "Private corporate R2 storage requires all credentials and a separate, non-public bucket." >&2
              exit 1
            fi
          fi

          if [ -z "${TERUMBU_DATABASE_URL}" ]; then
            TERUMBU_DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
          else
            TERUMBU_DATABASE_URL="$(clean_env_value "${TERUMBU_DATABASE_URL}")"
          fi

          : > terumbu.production.env
          write_env_value TERUMBU_APP_PORT "${APP_PORT}"
          write_env_value TERUMBU_POSTGRES_DB "${POSTGRES_DB}"
          write_env_value TERUMBU_POSTGRES_USER "${POSTGRES_USER}"
          write_env_value TERUMBU_POSTGRES_PASSWORD "${POSTGRES_PASSWORD}"
          write_env_value TERUMBU_DATABASE_URL "${TERUMBU_DATABASE_URL}"
          write_env_value NEXT_PUBLIC_APP_URL "${PUBLIC_URL}"
          write_env_value SESSION_COOKIE_SECURE "${SESSION_COOKIE_SECURE}"
          write_env_value NEXT_PUBLIC_MAPBOX_TOKEN "${NEXT_PUBLIC_MAPBOX_TOKEN}"
          write_env_value CLOUDFLARE_R2_ACCOUNT_ID "${CLOUDFLARE_R2_ACCOUNT_ID}"
          write_env_value CLOUDFLARE_R2_BUCKET "${CLOUDFLARE_R2_BUCKET}"
          write_env_value CLOUDFLARE_R2_ACCESS_KEY_ID "${CLOUDFLARE_R2_ACCESS_KEY_ID}"
          write_env_value CLOUDFLARE_R2_SECRET_ACCESS_KEY "${CLOUDFLARE_R2_SECRET_ACCESS_KEY}"
          write_env_value CLOUDFLARE_R2_PUBLIC_BASE_URL "${CLOUDFLARE_R2_PUBLIC_BASE_URL}"
          write_env_value CORPORATE_REPORT_STORAGE "${REPORT_STORAGE_MODE}"
          write_env_value CORPORATE_REPORT_R2_BUCKET "${REPORT_PRIVATE_BUCKET}"
          write_env_value MIDTRANS_SERVER_KEY "${MIDTRANS_SERVER_KEY}"
          write_env_value MIDTRANS_CLIENT_KEY "${MIDTRANS_CLIENT_KEY}"
          write_env_value XENDIT_SECRET_KEY "${XENDIT_SECRET_KEY}"
          write_env_value DEMO_GATEWAY_WEBHOOK_SECRET "${DEMO_GATEWAY_WEBHOOK_SECRET}"
          write_env_value RESEND_API_KEY "${RESEND_API_KEY}"
          write_env_value RESEND_FROM_EMAIL "${RESEND_FROM_EMAIL}"
          write_env_value SUPPORT_EMAIL "${SUPPORT_EMAIL}"
          write_env_value NEXT_PUBLIC_SUPPORT_WHATSAPP_URL "${NEXT_PUBLIC_SUPPORT_WHATSAPP_URL}"
          write_env_value POSTHOG_KEY "${POSTHOG_KEY}"
          write_env_value POSTHOG_HOST "${POSTHOG_HOST_VALUE}"
          write_env_value ADMIN_QUERY_WARN_MS "${ADMIN_QUERY_WARN_MS_VALUE}"
          write_env_value CRON_SECRET "${CRON_SECRET_VALUE}"
          write_env_value NEXT_PUBLIC_FX_USD_EUR "${NEXT_PUBLIC_FX_USD_EUR}"
          write_env_value NEXT_PUBLIC_FX_USD_IDR "${NEXT_PUBLIC_FX_USD_IDR}"
          write_env_value NEXT_PUBLIC_FX_USD_JPY "${NEXT_PUBLIC_FX_USD_JPY}"

      - name: Upload production env
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/terumbu_deploy_key "${VPS_USER}@${VPS_HOST}" 'mkdir -p /home/ubuntu/terumbu && chmod 700 /home/ubuntu/terumbu'
          scp -i ~/.ssh/terumbu_deploy_key terumbu.production.env "${VPS_USER}@${VPS_HOST}:/home/ubuntu/terumbu/.env"
          ssh -i ~/.ssh/terumbu_deploy_key "${VPS_USER}@${VPS_HOST}" 'chmod 600 /home/ubuntu/terumbu/.env'

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_REPO: https://github.com/${{ github.repository }}.git
          DEPLOY_REF: ${{ github.ref_name }}
          DEPLOY_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/terumbu_deploy_key "${VPS_USER}@${VPS_HOST}" \
            "DEPLOY_BASE=/home/ubuntu/terumbu DEPLOY_REPO='${DEPLOY_REPO}' DEPLOY_REF='${DEPLOY_REF}' DEPLOY_VERSION='${DEPLOY_VERSION}' bash -s" \
            < scripts/deploy-vps.sh

      - name: External production smoke
        run: |
          set -euo pipefail
          test -n "${TERUMBU_PUBLIC_URL:-}" || { echo "TERUMBU_PUBLIC_URL is required for external smoke checks"; exit 1; }
          BASE_URL="${TERUMBU_PUBLIC_URL}" EXPECTED_VERSION="${GITHUB_SHA}" bash scripts/smoke-production.sh
