# Temporary owner-approved bridge to the existing manually-gated CI/CD release.
# Remove this workflow after the single release is observed.
name: One-time approved Terumbu production release (2026-10-18)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-production-release-20261018.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: terumbu-approved-release-20261018
  cancel-in-progress: false

jobs:
  dispatch_verified_release:
    if: >-
      github.repository == 'bofandra/terumbu' &&
      github.actor == 'bofandra' &&
      startsWith(github.event.head_commit.message, 'ops: one-time approved Terumbu production release 2026-10-18')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout approved main revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Validate the exact approved release parent and SHA
        shell: bash
        run: |
          set -euo pipefail
          approved_parent="aa740a9e92703b0e7b5aa6207293079da6869325"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD^)" = "${approved_parent}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git log -1 --format=%s)" = "ops: one-time approved Terumbu production release 2026-10-18"
          echo "Owner-approved, one-time release identity verified: ${GITHUB_SHA}"

      - name: Dispatch standard exact-SHA production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Use the existing workflow_dispatch approval, CI + E2E,
          # pinned SSH, payment release gates, database backup, smoke and rollback.
          gh workflow run deploy.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f "release_sha=${GITHUB_SHA}" \
            -f "confirm_prod_deploy=true" \
            -f "release_ticket=TERUMBU-20261018-OWNER-APPROVED"
          echo "Dispatched approved exact-SHA release through standard CI/CD workflow."
