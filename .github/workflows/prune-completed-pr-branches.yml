name: One-time completed PR branch self-cleanup

on:
  push:
    branches: [main]
    paths: [".github/workflows/prune-completed-pr-branches.yml"]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: terumbu-completed-pr-branch-self-cleanup
  cancel-in-progress: false

jobs:
  prune:
    if: github.repository == 'bofandra/terumbu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_SHA: ${{ github.sha }}
      GITHUB_API_URL: ${{ github.api_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check each merged PR and unchanged branch SHA
        run: node scripts/prune-completed-pr-branches.mjs --dry-run
      - name: Delete only three fully merged exact PR heads
        run: node scripts/prune-completed-pr-branches.mjs --apply
