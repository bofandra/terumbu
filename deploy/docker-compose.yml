services:
  web:
    container_name: terumbu-web
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${TERUMBU_DATABASE_URL:?TERUMBU_DATABASE_URL is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
      CLOUDFLARE_R2_ACCOUNT_ID: ${CLOUDFLARE_R2_ACCOUNT_ID:-}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET:-}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_R2_PUBLIC_BASE_URL: ${CLOUDFLARE_R2_PUBLIC_BASE_URL:-}
      CORPORATE_REPORT_STORAGE: ${CORPORATE_REPORT_STORAGE:-local}
      CORPORATE_REPORT_R2_BUCKET: ${CORPORATE_REPORT_R2_BUCKET:-}
      MIDTRANS_PAYMENT_ENABLED: ${MIDTRANS_PAYMENT_ENABLED:-false}
      MIDTRANS_EXPEDITION_ENABLED: ${MIDTRANS_EXPEDITION_ENABLED:-false}
      MIDTRANS_AUTO_REFUND_ENABLED: ${MIDTRANS_AUTO_REFUND_ENABLED:-false}
      MIDTRANS_AUTO_REFUND_PRODUCTION_ENABLED: ${MIDTRANS_AUTO_REFUND_PRODUCTION_ENABLED:-false}
      MIDTRANS_ENV: ${MIDTRANS_ENV:-sandbox}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      XENDIT_SECRET_KEY: ${XENDIT_SECRET_KEY:-}
      DEMO_GATEWAY_WEBHOOK_SECRET: ${DEMO_GATEWAY_WEBHOOK_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      NEXT_PUBLIC_SUPPORT_WHATSAPP_URL: ${NEXT_PUBLIC_SUPPORT_WHATSAPP_URL:-}
      POSTHOG_KEY: ${POSTHOG_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://app.posthog.com}
      ADMIN_QUERY_WARN_MS: ${ADMIN_QUERY_WARN_MS:-750}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
      NEXT_PUBLIC_FX_USD_EUR: ${NEXT_PUBLIC_FX_USD_EUR:-}
      NEXT_PUBLIC_FX_USD_IDR: ${NEXT_PUBLIC_FX_USD_IDR:-}
      NEXT_PUBLIC_FX_USD_JPY: ${NEXT_PUBLIC_FX_USD_JPY:-}
    ports:
      - "${TERUMBU_APP_PORT:-3100}:3000"
    volumes:
      - terumbu_generated_reports:/app/data/corporate-reports
    depends_on:
      postgres:
        condition: service_healthy


  reminder-worker:
    # Shared authenticated hourly scheduler for reminders and corporate PDFs.
    container_name: terumbu-reminder-worker
    image: curlimages/curl:8.12.1
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
    command:
      - sh
      - -c
      - |
        # Deployment force-recreates this container. Do not sleep for an
        # hour before the first run, or frequent deploys can starve cron.
        # Wait for the web container to be reachable before posting jobs.
        until curl --fail --silent --max-time 5 http://web:3000/api/health >/dev/null; do
          echo "Waiting for Terumbu web readiness..."
          sleep 5
        done
        while true; do
          curl --fail --silent --show-error --max-time 60 \
            -X POST \
            -H "x-cron-secret: $${CRON_SECRET}" \
            http://web:3000/api/cron/expedition-reminders || true
          curl --fail --silent --show-error --max-time 600 \
            -X POST \
            -H "x-cron-secret: $${CRON_SECRET}" \
            http://web:3000/api/cron/corporate-reports || true
          curl --fail --silent --show-error --max-time 90 \
            -X POST \
            -H "x-cron-secret: ${CRON_SECRET}" \
            http://web:3000/api/cron/midtrans-compensations || true
          # Sleep only after both authenticated cron requests have run.
          sleep 3600
        done
    depends_on:
      web:
        condition: service_started

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: ${TERUMBU_DATABASE_URL:?TERUMBU_DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    container_name: terumbu-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TERUMBU_POSTGRES_DB:-terumbu}
      POSTGRES_USER: ${TERUMBU_POSTGRES_USER:-terumbu}
      POSTGRES_PASSWORD: ${TERUMBU_POSTGRES_PASSWORD:?TERUMBU_POSTGRES_PASSWORD is required}
    volumes:
      - terumbu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  terumbu_postgres_data:
  terumbu_generated_reports:
